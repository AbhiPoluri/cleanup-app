name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained exe
        run: >
          dotnet publish windows/Cleanup.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Compile installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\cleanup.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: CleanupSetup
          path: installer/Output/CleanupSetup.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        run: >
          gh release create ${{ github.ref_name }} installer/Output/CleanupSetup.exe
          --title "Cleanup ${{ github.ref_name }}"
          --notes "Windows installer — self-contained, no .NET install needed. Options for Start Menu / desktop shortcuts and run-at-signin."
        env:
          GH_TOKEN: ${{ github.token }}
